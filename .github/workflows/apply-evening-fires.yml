name: Apply tested evening fires patch
on:
  push:
    branches: [feat/evening-fires-tilt-shift]
    paths: [.github/workflows/apply-evening-fires.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gzip -dc evening-fires.patch.gz | git am
          git rm evening-fires.patch.gz
          git commit -m "Remove applied source patch archive"
          git push origin HEAD:feat/evening-fires-tilt-shift
