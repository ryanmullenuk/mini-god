name: Apply verified follower fix
on:
  push:
    branches: [fix/preserve-sculpt-jobs]
    paths: [.github/workflows/apply-jobs.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gzip -dc preserve-jobs.patch.gz | git am
          git rm preserve-jobs.patch.gz
          git commit -m "Remove completed transfer archive"
          git push origin HEAD:fix/preserve-sculpt-jobs
