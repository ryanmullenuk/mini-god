name: Import prepared Mini God source
on:
  push:
    paths:
      - '.github/workflows/import-source.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source bundle
        run: |
          test -f mini-god-public-source.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('mini-god-public-source.zip') as archive:
              for item in archive.infolist():
                  path = Path(item.filename)
                  assert path.parts[0] == 'mini-god' and '..' not in path.parts
                  target = Path(*path.parts[1:])
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(item))
          PY
          git rm mini-god-public-source.zip
          git add app components docs hooks lib public scripts .openai .gitignore .oxfmtrc.json .oxlintrc.json CONTRIBUTING.md README.md components.json next.config.ts package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json vite.config.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Expand Mini God source with complete folder structure'
          git push
